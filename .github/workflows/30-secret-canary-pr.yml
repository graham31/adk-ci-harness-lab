# Secret reachability under the SAFE pattern. A fork `pull_request` run must NOT
# receive repo secrets. We never print the secret: only its length and a short,
# non-reversible sha256 prefix, so 90-collect can match it against the known
# canary hash and be certain whether it was present.
name: harness-secret-canary-pr

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe secret presence
        env:
          S: ${{ secrets.CANARY_SECRET }}
        run: |
          if [ -n "$S" ]; then
            printf 'HARNESS_VERDICT=EXPOSED len=%s sha12=%s\n' \
              "${#S}" "$(printf %s "$S" | sha256sum | cut -c1-12)"
            echo "::error::EXPOSED — fork pull_request run can read CANARY_SECRET"
          else
            echo "HARNESS_VERDICT=SAFE — secret absent in fork pull_request run"
          fi
