# POSITIVE CONTROL (sandbox only). `pull_request_target` DOES expose secrets by
# design. This deliberately-vulnerable pattern proves the detector fires when a
# secret is genuinely reachable, so a SAFE result from 30-* is trustworthy.
# Never ship this pattern in a real repo.
name: harness-secret-positive-control

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm detector fires on an exposing config
        env:
          S: ${{ secrets.CANARY_SECRET }}
        run: |
          if [ -n "$S" ]; then
            printf 'HARNESS_VERDICT=EXPOSED(positive-control) len=%s sha12=%s\n' \
              "${#S}" "$(printf %s "$S" | sha256sum | cut -c1-12)"
          else
            printf 'HARNESS_VERDICT=SAFE(unexpected-for-control)\n'
            echo "::warning::positive control saw no secret — detector or setup is wrong"
          fi
